kind = "web"
previewPath = "/"
title = "Webmail Login Portal"
version = "1.0.0"
id = "artifacts/webmail"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23342

[services.development]
run = "pnpm --filter @workspace/webmail run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/webmail", "run", "build" ]
serve = "static"
publicDir = "artifacts/webmail/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23342"
BASE_PATH = "/"
